<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>来場者カウンター</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="home">
  <div class="home-container">
    <h1>🎫 来場者カウンター</h1>
    <p class="subtitle">モードを選択してください</p>
    <div class="home-buttons">
      <a href="counter.html" class="btn btn-counter">
        <span class="btn-icon">➕</span>
        <span class="btn-label">カウンター</span>
        <span class="btn-desc">スタッフ用</span>
      </a>
      <a href="admin.html" class="btn btn-admin">
        <span class="btn-icon">📊</span>
        <span class="btn-label">管理画面</span>
        <span class="btn-desc">代表者用</span>
      </a>
    </div>
  </div>
  <script>
    const removeBadge = () => {
      document.querySelectorAll('a[href*="netlify.com"]').forEach(el => {
        const root = el.closest('[style*="position: fixed"], [style*="position:fixed"]') || el.parentElement;
        if (root) root.remove();
      });
    };
    removeBadge();
    new MutationObserver(removeBadge).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
